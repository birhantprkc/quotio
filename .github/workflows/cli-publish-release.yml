name: Publish package channels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing cli-v* release tag to publish
        required: true
        type: string
      publish_homebrew:
        description: Update Homebrew after publishing npm
        type: boolean
        default: true

permissions: {}
concurrency:
  group: cli-publish-release
  cancel-in-progress: false

jobs:
  github:
    name: Preserve macOS latest release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Keep CLI release out of GitHub latest
        run: |
          [[ "$RELEASE_TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          app_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | first | .tag_name')
          [[ "$app_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release edit "$app_tag" --repo "$GITHUB_REPOSITORY" --latest
  npm:
    name: Publish npm package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'cli-v')
    needs: github
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing provenance.
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Download and verify npm artifact
        run: |
          [[ "$RELEASE_TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          version=${RELEASE_TAG#cli-v}
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "quotio-$version.tgz" --pattern SHA256SUMS
          awk -v name="quotio-$version.tgz" '$2 == name' SHA256SUMS > npm.sha256
          test "$(wc -l < npm.sha256)" -eq 1
          sha256sum --check npm.sha256
      - name: Publish npm with trusted publishing
        run: |
          version=${RELEASE_TAG#cli-v}
          channel=latest
          if [[ "$version" == *-* ]]; then channel=next; fi
          local_integrity=$(node -e 'const fs=require("fs"),c=require("crypto"); console.log("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "quotio-$version.tgz")
          if existing=$(npm view "quotio@$version" dist.integrity --json 2>/dev/null); then
            test "$existing" = "\"$local_integrity\""
            echo 'The identical npm package is already published.'
          else
            npm publish "quotio-$version.tgz" --access public --tag "$channel" --provenance
          fi
  publish-github:
    name: Publish verified CLI release
    if: github.event_name == 'workflow_dispatch'
    needs: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Publish prepared draft after npm succeeds
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
  homebrew:
    name: Update Homebrew tap
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_homebrew) || startsWith(github.event.release.tag_name, 'cli-v')
    needs: npm
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
    steps:
      - name: Download and verify formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          version=${RELEASE_TAG#cli-v}
          formula=quotio.rb
          if [[ "$version" == *-* ]]; then formula=quotio-beta.rb; fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$formula"
          expected=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$formula\") | .digest")
          [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "${expected#sha256:}" "$formula" | sha256sum --check -
          ruby -c "$formula"
      - name: Update existing Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          : "${HOMEBREW_TAP_SSH_KEY:?Set the tap deploy key secret}"
          : "${TAP_REPOSITORY:?Set HOMEBREW_TAP_REPOSITORY}"
          [[ "$TAP_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          version=${RELEASE_TAG#cli-v}
          formula=quotio.rb
          if [[ "$version" == *-* ]]; then formula=quotio-beta.rb; fi
          private=$(mktemp -d)
          trap 'rm -rf "$private"' EXIT
          printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" > "$private/key"
          chmod 600 "$private/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$private/known_hosts"
          test -s "$private/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $private/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$private/known_hosts"
          git clone --depth 1 "git@github.com:$TAP_REPOSITORY.git" "$private/tap"
          mkdir -p "$private/tap/Formula"
          cp "$formula" "$private/tap/Formula/$formula"
          cd "$private/tap"
          git add "Formula/$formula"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(quotio): update to $RELEASE_TAG"
          git push origin HEAD
